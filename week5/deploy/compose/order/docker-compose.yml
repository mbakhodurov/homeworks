services:
  postgres-order:
    image: ${POSTGRES_IMAGE_NAME}
    container_name: postgres-order
    env_file:
      - .env
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    ports:
      - "${EXTERNAL_POSTGRES_PORT}:${POSTGRES_PORT}"
    healthcheck: # Проверяем "здоровье" контейнера базы
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped # Автоматический перезапуск контейнера, кроме ручной остановки
    networks:
      - microservices-net

networks:
  microservices-net:
    external: true
    # driver: bridge # Обычная bridge-сеть Docker

volumes:
  postgres_order_data: 
   